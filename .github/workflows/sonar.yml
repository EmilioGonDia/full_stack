name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar análisis de SonarCloud
        uses: SonarSource/sonarcloud-github-action@cb4da018e982034e393a52f4c9c1221f710f21e5 # v4.0.0
        with:
            args: >
              -Dsonar.sourceEncoding=UTF-8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Token automático de GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # Tu token guardado en Secrets